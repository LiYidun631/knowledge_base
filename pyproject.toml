[project]
name = "knowledge-service"
version = "0.1.0"
description = "Embeddable knowledge base module with offline ingestion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncmy>=0.2,<1",
    "beautifulsoup4>=4,<5",
    "boto3>=1.35,<2",
    "chromadb>=0.5,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.6,<3",
    "pypdf>=5,<7",
    "pymupdf>=1.24,<2",
    "python-pptx>=1,<2",
    "python-docx>=1,<2",
    "striprtf>=0.0.26,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "xlrd>=2,<3",
    "uvicorn[standard]>=0.30,<1",
    "cryptography>=42,<47",
]

[project.scripts]
provision-knowledge-catalog = "knowledge_service.cli.provision_catalog:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".uv-cache", ".pytest_cache", "__pycache__", ".qoder-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
